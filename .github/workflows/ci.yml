name: CALU AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Run 45+ Security & Integration Tests
        run: npx tsx test/runTests.ts
        env:
          NODE_ENV: test
          VITE_DEMO_MODE: 'true'
